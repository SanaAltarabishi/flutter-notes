name: freenotes_app
description: A handwriting note-taking app with MyScript recognition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.3
  path_provider: ^2.1.6
  path: ^1.9.0
  dio: ^5.11.0
  equatable: ^2.1.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  pdf: ^3.13.0
  share_plus: ^13.3.0
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  fpdart: ^1.2.0
  flex_color_picker: ^3.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
